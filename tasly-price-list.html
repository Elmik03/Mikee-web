<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TASLY Products Price List</title>
<style>
:root{
  --bg:#fff; --ink:#000; --muted:#505050; --rule:#cfcfcf; --band:#000; --band-ink:#fff; --hover:#f2f2f2; --logo-filter:none;
  --font:"Trebuchet MS",Verdana,Tahoma,"DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --ink:#fff; --muted:#b5b5b5; --rule:#3a3a3a; --band:#fff; --band-ink:#000; --hover:#1a1a1a; --logo-filter:invert(1);}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 48px}
.masthead{display:flex;align-items:center;border:2px solid var(--ink)}
.masthead .logo{flex:0 0 auto;padding:12px 18px;border-right:2px solid var(--ink);display:flex;align-items:center}
.masthead img{display:block;height:46px;width:auto;filter:var(--logo-filter)}
.masthead h1{margin:0;flex:1;text-align:center;font-size:clamp(18px,4.4vw,32px);font-weight:800;letter-spacing:-.01em;line-height:1.15;padding:10px 12px}
.tools{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.search{flex:1 1 220px;position:relative}
.search input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:0;appearance:none}
.search input::placeholder{color:var(--muted)}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);padding:12px 18px;background:var(--ink);color:var(--bg);border-radius:0}
button.ghost{background:var(--bg);color:var(--ink)}
button:hover{opacity:.88}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.count{font-size:14px;color:var(--muted);margin:0 0 8px}
table{width:100%;border-collapse:collapse}
thead th{background:var(--band);color:var(--band-ink);padding:12px 10px;font-size:15px;font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
thead th.l{text-align:left}
tbody td{padding:11px 10px;text-align:center;border-bottom:1px solid var(--rule);font-variant-numeric:tabular-nums}
tbody td.sn{font-weight:700;width:52px}
tbody td.name{text-align:left;font-weight:700}
tbody td.dist{font-weight:800}
tbody td.retail{font-weight:700}
tbody td.content{font-weight:700;white-space:nowrap}
tbody tr:hover td{background:var(--hover)}
tbody tr.sec td{border-top:2px solid var(--ink)}
tbody tr:last-child td{border-bottom:2px solid var(--ink)}
.table-frame{border:2px solid var(--ink);border-top:0}
.empty{display:none;padding:28px 14px;text-align:center;border:2px solid var(--ink);border-top:0}
.empty.show{display:block}
.empty button{margin-top:12px}
.note{margin-top:18px;font-size:14px;color:var(--muted)}
/* dialog */
dialog{border:2px solid var(--ink);background:var(--bg);color:var(--ink);padding:0;max-width:min(560px,94vw);max-height:94vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg-body{padding:14px}
.dlg-body img{display:block;width:100%;height:auto;border:1px solid var(--rule);background:#fff}
.dlg-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.dlg-bar button{flex:1 1 150px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
@media (max-width:680px){
  .wrap{padding:10px 10px 40px}
  .masthead .logo{padding:8px 10px}
  .masthead img{height:30px}
  thead{display:none}
  table,tbody{display:block}
  .table-frame{border-top:2px solid var(--ink)}
  tbody tr{display:grid;grid-template-columns:34px 1fr 1fr 1fr;gap:2px 8px;padding:12px 10px;border-bottom:1px solid var(--rule)}
  tbody tr.sec{border-top:2px solid var(--ink)}
  tbody tr:last-child{border-bottom:0}
  tbody td{display:block;border:0;padding:0;text-align:left}
  tbody tr.sec td{border:0}
  tbody tr:last-child td{border:0}
  td.sn{grid-row:1;grid-column:1;width:auto;font-size:15px;color:var(--muted)}
  td.name{grid-row:1;grid-column:2/5;font-size:17px}
  td.content{grid-row:2;grid-column:2/5;white-space:normal;font-weight:400;color:var(--muted);font-size:14px;margin-bottom:6px}
  td.bv,td.dist,td.retail{grid-row:3;font-size:16px}
  td.bv{grid-column:2}
  td.dist{grid-column:3}
  td.retail{grid-column:4}
  td.bv::before,td.dist::before,td.retail::before{content:attr(data-label);display:block;font-size:12px;font-weight:400;color:var(--muted)}
}
@media print{.tools,.note,.count{display:none}}
</style>
</head>

    <h1>TASLY Products Price List</h1>
  </header>

  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="Search product or content" aria-label="Search products" autocomplete="off"></div>
    <button id="dl">Download image</button>
  </div>
  <p class="count" id="count" aria-live="polite"></p>

  <div class="table-frame">
    <table>
      <thead><tr><th>S/N</th><th class="l">Product</th><th>BV</th><th>Distributor</th><th>Retail</th><th>Content</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="empty" id="empty"><p id="emptyMsg"></p><button class="ghost" id="clear">Clear search</button></div>
  <p class="note">The downloaded image always includes all 27 products, whatever you have searched for.</p>
</main>

<dialog id="dlg" aria-label="Price list image">
  <div class="dlg-body">
    <img id="preview" alt="TASLY Products Price List image">
    <div class="dlg-bar">
      <button id="save">Save image</button>
      <button class="ghost" id="rot">Original orientation</button>
      <button class="ghost" id="close">Close</button>
    </div>
    <p class="hint">If Save does nothing on your phone, press and hold the image and choose Save or Share.</p>
  </div>
</dialog>

<script>
const DATA=[
[1,"Propolis Syrup","26.5","25,175","37,000","20ml / 1 bottle"],
[2,"Propolis & Water Lily","16","15,200","24,000","500mg / 30 caps"],
[3,"Propolis Softgel","20.5","19,475","24,000","400mg / 20 caps"],
[4,"Danshen Tea","15","14,250","28,000","1500mg / 20 sachets"],
[5,"Pollen Tea","16","15,200","29,000","1500mg / 20 sachets"],
[6,"Ginseng RH2","58","55,100","61,000","350mg / 30 caps"],
[7,"Propolis & Glossy Ganoderma","16.4","15,580","24,000","250mg / 30 caps"],
[8,"A1 Capsule","60","57,000","63,000","400mg / 60 caps"],
[9,"ICP (Danshen Pill)","23","21,850","29,000","250mg / 30 caps"],
[10,"Red Yeast","23","21,850","28,000","650mg / 60 tabs"],
[11,"Cordyceps","27","25,650","30,000","500mg / 60 caps"],
[12,"CenForte","25","23,750","50,000","1200mg / 100 tabs"],
[13,"Milk Calcium","24.5","23,275","46,000","1000mg / 100 tabs"],
[14,"Phytoestrogen","24","22,800","27,000","500mg / 90 tabs"],
[15,"Citrus Sour","18","17,100","26,000","4000mg / 12 tabs"],
[16,"I-Cleansing","10","10,100","19,000","300mg / 20 caps"],
[17,"B-Cleansing","19","18,050","23,000","4000mg / 10 sachets"],
[18,"Bitter Melon","21","19,950","26,000","500mg / 30 caps"],
[19,"King's Capsule","39","37,050","43,000","300mg / 6 caps"],
[20,"Tong Bi","36","34,200","40,000","420mg / 60 caps"],
[21,"Tong Luo","26","24,700","33,000","260mg / 30 caps"],
[22,"Qingwen","32","30,400","36,000","310mg / 36 caps"],
[23,"Femate","32","30,400","36,000","310mg / 50 caps"],
[24,"Heat Relief","34","32,300","38,000","\u2014"],
[25,"Royal Jelly","23.6","22,420","28,000","500mg / 30 caps"],
[26,"BP Machine","40","38,000","56,000","\u2014"],
[27,"Massage Machine","50","47,500","69,000","\u2014"]
];
const SECTION_STARTS=new Set([6,13]); // thicker divider lines, as in the printed list
const $=id=>document.getElementById(id);
const rowsEl=$('rows'), q=$('q');

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  const t=q.value.trim().toLowerCase();
  const list=DATA.filter(r=>!t||(r[0]+' '+r[1]+' '+r[5]).toLowerCase().includes(t));
  rowsEl.innerHTML=list.map(r=>`<tr${SECTION_STARTS.has(r[0])&&!t?' class="sec"':''}>
    <td class="sn">${r[0]}</td><td class="name">${esc(r[1])}</td>
    <td class="bv" data-label="BV">${r[2]}</td>
    <td class="dist" data-label="Distributor">${r[3]}</td>
    <td class="retail" data-label="Retail">${r[4]}</td>
    <td class="content">${r[5]}</td></tr>`).join('');
  $('count').textContent=t?`${list.length} of 27 products`:'27 products';
  const none=!list.length;
  $('empty').classList.toggle('show',none);
  $('emptyMsg').textContent=none?`No product matches "${q.value.trim()}". Try a product name or a content such as "caps".`:'';
  document.querySelector('.table-frame').style.display=none?'none':'';
}
q.addEventListener('input',render);
$('clear').onclick=()=>{q.value='';render();q.focus()};
render();

/* ---------- image export ---------- */
const LOGO=new Image(); LOGO.src=document.querySelector('.masthead img').src;
const FONT='"Trebuchet MS",Verdana,Tahoma,"DejaVu Sans",sans-serif';
function drawList(scale){
  // layout in 1086 x 1448 units, matching the printed list
  const W=1086,H=1448,S=scale;
  const c=document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const g=c.getContext('2d'); g.scale(S,S);
  g.fillStyle='#fff'; g.fillRect(0,0,W,H);
  g.fillStyle='#000'; g.strokeStyle='#000';
  const L=26,R=1066,T=14,HB=108,HT=154,B=1432;
  const cols=[26,93,372,480,653,807,1066];
  // masthead box
  g.lineWidth=3; g.strokeRect(L,T,R-L,HB-T-6);
  const dv=440; g.beginPath(); g.moveTo(dv,T); g.lineTo(dv,HB-6); g.stroke();
  const lh=62, lw=lh*LOGO.naturalWidth/LOGO.naturalHeight;
  g.drawImage(LOGO,(L+dv)/2-lw/2,(T+HB-6)/2-lh/2,lw,lh);
  g.font=`800 44px ${FONT}`; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('TASLY Products Price List',(dv+R)/2,(T+HB-6)/2+2);
  // header band
  g.fillRect(L,HB,R-L,HT-HB);
  g.fillStyle='#fff'; g.font=`700 23px ${FONT}`;
  ['S/N','Product','BV','Distributor','Retail','Content'].forEach((t,i)=>g.fillText(t,(cols[i]+cols[i+1])/2,(HB+HT)/2+1));
  // body
  const sec1=HT+(B-HT)*0.167, sec2=HT+(B-HT)*0.5; // overwritten below by exact heights
  const h1=43,h2=46,h3=(B-(HT+5*43+7*46))/15;
  let y=HT; const ys=[];
  DATA.forEach((r,i)=>{
    const h=i<5?h1:i<12?h2:h3, cy=y+h/2;
    g.fillStyle='#000'; g.textAlign='center';
    g.font=`700 23px ${FONT}`; g.fillText(String(r[0]),(cols[0]+cols[1])/2,cy);
    let sz=23; g.font=`700 ${sz}px ${FONT}`;
    while(g.measureText(r[1]).width>cols[2]-cols[1]-26) {sz-=.5; g.font=`700 ${sz}px ${FONT}`;}
    g.textAlign='left'; g.fillText(r[1],cols[1]+16,cy);
    g.textAlign='center';
    g.font=`400 23px ${FONT}`; g.fillText(r[2],(cols[2]+cols[3])/2,cy);
    g.font=`800 23px ${FONT}`; g.fillText(r[3],(cols[3]+cols[4])/2,cy);
    g.font=`700 23px ${FONT}`; g.fillText(r[4],(cols[4]+cols[5])/2,cy);
    sz=22; g.font=`700 ${sz}px ${FONT}`;
    while(g.measureText(r[5]).width>cols[6]-cols[5]-16){sz-=.5; g.font=`700 ${sz}px ${FONT}`;}
    g.fillText(r[5],(cols[5]+cols[6])/2,cy);
    y+=h; ys.push(y);
  });
  // rules
  g.lineWidth=2.5;
  cols.forEach((x,i)=>{g.beginPath();g.moveTo(x,i===0||i===6?HB:HT);g.lineTo(x,B);g.stroke();});
  [HT+5*h1,HT+5*h1+7*h2,B].forEach(yy=>{g.beginPath();g.moveTo(L,yy);g.lineTo(R,yy);g.stroke();});
  return c;
}
let current=null, rotated=false;
function build(rot){
  const c=drawList(3);
  if(!rot) return c;
  const r=document.createElement('canvas'); r.width=c.height; r.height=c.width;
  const g=r.getContext('2d'); g.translate(0,r.height); g.rotate(-Math.PI/2); g.drawImage(c,0,0);
  return r;
}
async function show(rot){
  if(LOGO.decode) try{await LOGO.decode()}catch(e){}
  rotated=rot; current=build(rot);
  $('preview').src=current.toDataURL('image/png');
  $('rot').textContent=rot?'Portrait orientation':'Original orientation';
}
$('dl').onclick=async()=>{await show(false); $('dlg').showModal();};
$('rot').onclick=()=>show(!rotated);
$('close').onclick=()=>$('dlg').close();
$('save').onclick=()=>{
  current.toBlob(b=>{
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='TASLY-Products-Price-List.png'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
};
</script>
</body>
</html>
